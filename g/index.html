<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonría Pues · Tus fotos</title>
<meta name="theme-color" content="#fffdf8">
<link rel="icon" href="../public/marca/icono.png" type="image/png">
<style>
  :root { --primario: #d6a545; --secundario: #184659; --fondo: #fffdf8; --texto: #2e2821; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: var(--texto);
    background: radial-gradient(120% 60% at 50% 0%, color-mix(in srgb, var(--primario) 18%, var(--fondo)) 0%, var(--fondo) 70%) fixed;
  }
  header { text-align: center; padding: 26px 16px 6px; }
  header img { max-height: 130px; max-width: 78%; }
  header p { margin: 8px 0 0; font-weight: 600; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; display: grid; gap: 18px; }
  figure {
    margin: 0;
    padding: 12px;
    background: #fff;
    border: 1px solid rgba(46, 40, 33, 0.1);
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(60, 45, 20, 0.12);
  }
  figure img, figure video { width: 100%; display: block; border-radius: 10px; background: #000; }
  figure img[hidden], figure video[hidden], .boton[hidden] { display: none; }
  .subiendo {
    display: grid;
    place-items: center;
    gap: 10px;
    min-height: 220px;
    padding: 24px;
    border-radius: 10px;
    background: color-mix(in srgb, var(--primario) 10%, #fff);
    text-align: center;
  }
  .subiendo[hidden] { display: none; }
  .rueda { width: 42px; height: 42px; border-radius: 50%; border: 4px solid color-mix(in srgb, var(--primario) 30%, transparent); border-top-color: var(--primario); animation: girar 1s linear infinite; }
  @keyframes girar { to { transform: rotate(1turn); } }
  .boton {
    display: block;
    margin-top: 12px;
    padding: 14px;
    border-radius: 999px;
    text-align: center;
    font-weight: 700;
    color: #fff;
    text-decoration: none;
    background: linear-gradient(135deg, color-mix(in srgb, var(--secundario) 85%, #fff), var(--secundario));
  }
  .ayuda { text-align: center; font-size: 14px; opacity: .72; padding: 4px 16px 36px; }
  .vacio { text-align: center; padding: 40px 20px; }
</style>
</head>
<body>
<header>
  <img src="../public/marca/logo.png" alt="Sonría Pues Photobooth">
  <p id="evento"></p>
</header>
<main id="galeria"></main>
<p class="ayuda">¿No se descarga? Mantén presionada la foto y elige “Guardar imagen”.</p>

<script type="module">
  import { leerEnlace, urlDeArchivo } from '../public/js/nube.js';

  const galeria = document.getElementById('galeria');
  const etiquetas = { jpg: 'Descargar foto', png: 'Descargar foto', gif: 'Descargar GIF', mp4: 'Descargar video', webm: 'Descargar video' };

  /**
   * Enlace permanente de la cabina: ?c=<cuenta>&s=<sesión>&a=<archivos>
   * Cada letra es un archivo: r = recuerdo, a = GIF, b = boomerang, v/w = video, 1-9 = fotos.
   */
  function leerEnlacePermanente() {
    const p = new URLSearchParams(location.search);
    const cuenta = p.get('c') || '';
    const sesion = p.get('s') || '';
    const codigos = p.get('a') || 'r';
    if (!/^[a-z0-9_-]{1,80}$/i.test(cuenta) || !/^[0-9]{8}-[0-9]{6}-[0-9a-f]{6,16}$/.test(sesion)) return null;
    const nombres = { r: ['recuerdo', 'jpg', 'image'], a: ['animacion', 'gif', 'image'], b: ['boomerang', 'gif', 'image'], v: ['video', 'mp4', 'video'], w: ['video', 'mp4', 'video'] };
    const archivos = [];
    for (const c of codigos) {
      const [base, formato, tipo] = nombres[c] || (/^[1-9]$/.test(c) ? [`foto-${c}`, 'jpg', 'image'] : []);
      if (!base) continue;
      const ruta = `sonria/${sesion}/${base}.${formato}`;
      archivos.push({
        tipo,
        formato,
        url: `https://res.cloudinary.com/${cuenta}/${tipo}/upload/${ruta}`,
        descarga: `https://res.cloudinary.com/${cuenta}/${tipo}/upload/fl_attachment/${ruta}`,
      });
    }
    return archivos.length ? archivos : null;
  }

  /** Enlace de la versión web: #<datos> (archivos ya subidos desde el navegador). */
  function leerEnlaceWeb() {
    const datos = leerEnlace(location.hash);
    if (!datos?.a?.length) return null;
    document.getElementById('evento').textContent = datos.e || '';
    return datos.a.map((a) => ({
      tipo: a.tipo === 'v' ? 'video' : 'image',
      formato: a.formato,
      url: urlDeArchivo(datos.c, a),
      descarga: urlDeArchivo(datos.c, a, true),
    }));
  }

  /** Muestra el archivo; si todavía se está subiendo, avisa y reintenta solo. */
  function mostrar(archivo) {
    const figura = document.createElement('figure');
    const espera = document.createElement('div');
    espera.className = 'subiendo';
    espera.hidden = true;
    espera.innerHTML = '<div class="rueda"></div><strong>Tus fotos se están subiendo…</strong><span>En cuanto estén listas aparecen aquí solas. No cierres esta página.</span>';

    const medio = document.createElement(archivo.tipo === 'video' ? 'video' : 'img');
    if (archivo.tipo === 'video') Object.assign(medio, { controls: true, playsInline: true, loop: true, muted: true, autoplay: true, preload: 'metadata' });
    else medio.alt = 'Tu recuerdo';

    const boton = document.createElement('a');
    boton.className = 'boton';
    boton.href = archivo.descarga;
    boton.textContent = etiquetas[archivo.formato] || 'Descargar';
    boton.hidden = true;

    let intento = 0;
    const cargar = () => {
      intento += 1;
      medio.src = intento === 1 ? archivo.url : `${archivo.url}?intento=${intento}`;
    };
    const listo = () => {
      espera.hidden = true;
      medio.hidden = false;
      boton.hidden = false;
    };
    const falta = () => {
      medio.hidden = true;
      espera.hidden = false;
      setTimeout(cargar, 6000);
    };
    medio.addEventListener(archivo.tipo === 'video' ? 'loadeddata' : 'load', listo);
    medio.addEventListener('error', falta);

    figura.append(espera, medio, boton);
    galeria.append(figura);
    cargar();
  }

  const archivos = leerEnlacePermanente() || leerEnlaceWeb();
  if (!archivos) {
    galeria.innerHTML = '<p class="vacio">No encontramos estas fotos.<br>Pide en la cabina que te muestren el código QR otra vez.</p>';
  } else {
    archivos.forEach(mostrar);
  }
</script>
</body>
</html>
